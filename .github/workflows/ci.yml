name: Coffee World CI
on:
  push:
    branches: [feat/coffee-world-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Gameplay regression tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Export artist-quality WebP atlases
        run: node scripts/export-art.mjs
      - name: Browser E2E tests
        run: npm run test:e2e
      - name: Commit generated binary art to development branch
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/coffee-world-foundation') || (github.event_name == 'pull_request' && github.head_ref == 'feat/coffee-world-foundation' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/*-v069.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(v0.6.9): refresh full-resolution WebP art atlases [skip ci]'
            git push origin HEAD:feat/coffee-world-foundation
          fi
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
